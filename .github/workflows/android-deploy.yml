name: Build and Deploy to Play Store

on:
  push:
    branches:
      - main
    paths:
      - 'Android/**'
      - '!Android/Assets/**'
      - '!Android/README.md'
      - '.github/workflows/android-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy to internal track
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/keystore.jks

      - name: Create local.properties
        run: |
          cat <<EOF > local.properties
          signing.storeFile=${{ runner.temp }}/keystore.jks
          signing.storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          signing.keyAlias=${{ secrets.KEY_ALIAS }}
          signing.keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release AAB
        run: VERSION_CODE=$((GITHUB_RUN_NUMBER + 100)) ./gradlew bundleRelease

      - name: Upload to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tsubuzaki.djdxgo
          releaseFiles: Android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft